<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#6FA991"
  >

  <title>ITSNONO_STUDIO｜線上預約</title>


  <style>

    /* ==================================================
       RESET
    ================================================== */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }


    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }


    body {
      margin: 0;
      min-height: 100vh;

      background:
        linear-gradient(
          180deg,
          #FFF8E9 0%,
          #FFF9EE 100%
        );

      color: #4C514D;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }


    /* ==================================================
       HEADER
    ================================================== */

    .header {
      width: 100%;

      background:
        linear-gradient(
          135deg,
          #6FA991 0%,
          #629D85 100%
        );

      color: #FFFFFF;

      padding:
        max(28px, env(safe-area-inset-top))
        24px
        32px;

      position: relative;
      overflow: hidden;
    }


    .header::before {
      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      right: -70px;
      top: -90px;

      border-radius: 50%;

      background:
        rgba(255, 255, 255, 0.08);
    }


    .header::after {
      content: "";

      position: absolute;

      width: 120px;
      height: 120px;

      left: -70px;
      bottom: -80px;

      border-radius: 50%;

      background:
        rgba(255, 255, 255, 0.06);
    }


    .header-inner {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 780px;

      margin: 0 auto;
    }


    .header-small {
      color: #FFF0CE;

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 1.5px;
    }


    .header-title {
      margin-top: 7px;

      font-size:
        clamp(25px, 5vw, 32px);

      line-height: 1.25;

      font-weight: 800;

      letter-spacing: 1px;
    }


    .header-sub {
      margin-top: 7px;

      color: #EAF4EC;

      font-size: 12px;

      letter-spacing: 1.5px;
    }


    /* ==================================================
       CONTAINER
    ================================================== */

    .container {
      width: 100%;
      max-width: 780px;

      margin: 0 auto;

      padding:
        24px 18px
        calc(40px + env(safe-area-inset-bottom));
    }


    /* ==================================================
       BOOKING CARD
    ================================================== */

    .booking-card {
      background: #FFFFFF;

      border:
        1px solid rgba(233, 201, 157, 0.75);

      border-radius: 18px;

      padding:
        22px 18px 24px;

      box-shadow:
        0 8px 30px
        rgba(63, 98, 87, 0.08);
    }


    .section-title {
      display: flex;

      align-items: center;

      gap: 10px;

      color: #3F6257;

      font-size: 20px;

      font-weight: 800;

      margin-bottom: 4px;
    }


    .section-title::before {
      content: "";

      width: 5px;
      height: 23px;

      border-radius: 10px;

      background: #F18782;
    }


    .section-description {
      margin:
        0 0 22px 15px;

      color: #8A8D87;

      font-size: 13px;

      line-height: 1.6;
    }


    /* ==================================================
       FORM
    ================================================== */

    .form-group {
      margin-top: 20px;
    }


    .form-group:first-of-type {
      margin-top: 0;
    }


    label {
      display: block;

      margin-bottom: 8px;

      color: #71847B;

      font-size: 14px;

      font-weight: 600;
    }


    select,
    input {
      display: block;

      width: 100%;

      min-height: 48px;

      padding:
        12px 14px;

      border:
        1px solid #E9C99D;

      border-radius: 10px;

      background: #FFFFFF;

      font-family: inherit;

      font-size: 16px;

      color: #4C514D;

      outline: none;

      transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }


    select:focus,
    input:focus {
      border-color: #6FA991;

      background: #FBFFFC;

      box-shadow:
        0 0 0 3px
        rgba(111, 169, 145, 0.15);
    }


    input::placeholder {
      color: #B7BAB5;
    }


    /* ==================================================
       SELECT
    ================================================== */

    select {
      appearance: none;
      -webkit-appearance: none;

      background-image:

        linear-gradient(
          45deg,
          transparent 50%,
          #6FA991 50%
        ),

        linear-gradient(
          135deg,
          #6FA991 50%,
          transparent 50%
        );

      background-position:

        calc(100% - 18px) 21px,
        calc(100% - 12px) 21px;

      background-size:
        6px 6px,
        6px 6px;

      background-repeat: no-repeat;

      padding-right: 40px;
    }


    /* ==================================================
       DATE
    ================================================== */

    .date-input {
      appearance: auto;
      -webkit-appearance: auto;

      color-scheme: light;
    }


    /* ==================================================
       TIME
    ================================================== */

    .time-wrapper {
      margin-top: 20px;
    }


    .times {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 9px;
    }


    .time-button {
      width: 100%;

      min-height: 48px;

      border:
        1px solid #6FA991;

      background: #FFFFFF;

      color: #3F6257;

      border-radius: 10px;

      padding:
        11px 5px;

      font-family: inherit;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;

      transition:
        all .18s ease;

      -webkit-tap-highlight-color:
        transparent;
    }


    .time-button:hover {
      background: #F2FAF5;

      transform:
        translateY(-1px);
    }


    .time-button:active {
      transform:
        scale(.97);
    }


    .time-button.selected {
      background: #6FA991;

      border-color: #6FA991;

      color: #FFFFFF;

      box-shadow:
        0 4px 10px
        rgba(111, 169, 145, 0.25);
    }


    .no-time {
      grid-column: 1 / -1;

      padding:
        15px 10px;

      border-radius: 10px;

      background: #FAF8F2;

      color: #8A8D87;

      font-size: 14px;

      line-height: 1.6;

      text-align: center;
    }


    /* ==================================================
       LOADING
    ================================================== */

    .loading {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 7px;
    }


    .loading-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #6FA991;

      animation:
        loading 1s infinite ease-in-out;
    }


    .loading-dot:nth-child(2) {
      animation-delay: .15s;
    }


    .loading-dot:nth-child(3) {
      animation-delay: .3s;
    }


    @keyframes loading {

      0%,
      60%,
      100% {
        opacity: .3;

        transform:
          translateY(0);
      }

      30% {
        opacity: 1;

        transform:
          translateY(-3px);
      }

    }


    /* ==================================================
       SUBMIT
    ================================================== */

    .submit {
      display: block;

      width: 100%;

      min-height: 52px;

      margin-top: 28px;

      padding:
        14px 18px;

      border: none;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          #F18782 0%,
          #E97D78 100%
        );

      color: #FFFFFF;

      font-family: inherit;

      font-size: 17px;

      font-weight: 800;

      letter-spacing: 1px;

      cursor: pointer;

      box-shadow:
        0 6px 15px
        rgba(241, 135, 130, 0.22);

      transition:
        transform .15s ease,
        box-shadow .15s ease,
        opacity .2s ease;
    }


    .submit:hover {
      transform:
        translateY(-1px);

      box-shadow:
        0 8px 18px
        rgba(241, 135, 130, 0.28);
    }


    .submit:active {
      transform:
        scale(.985);
    }


    .submit:disabled {
      opacity: .55;

      cursor: not-allowed;

      transform: none;

      box-shadow: none;
    }


    /* ==================================================
       MESSAGE
    ================================================== */

    .message {
      margin-top: 18px;

      color: #3F6257;

      line-height: 1.8;

      font-size: 14px;
    }


    /* ==================================================
       SUCCESS / ERROR
    ================================================== */

    .success {
      padding:
        20px 18px;

      margin-top: 0;

      border-radius: 13px;

      background: #FFFDF8;

      border:
        1px solid #E9C99D;

      box-shadow:
        0 4px 14px
        rgba(76, 81, 77, 0.05);

      text-align: left;
    }


    .success-title {
      color: #3F6257;

      font-size: 20px;

      font-weight: 800;

      text-align: center;

      margin-bottom: 12px;
    }


    .reservation-id {
      display: block;

      width: 100%;

      color: #F18782;

      font-size: 18px;

      font-weight: 800;

      text-align: center;

      margin:
        5px 0 18px;
    }


    .success-info {
      padding: 14px;

      border-radius: 10px;

      background: #FFFFFF;

      border:
        1px solid #F0E5D4;
    }


    .success-row {
      padding: 8px 0;

      border-bottom:
        1px solid #F1ECE3;

      font-size: 14px;

      line-height: 1.6;
    }


    .success-row:last-child {
      border-bottom: none;
    }


    .success-label {
      color: #8A8D87;

      font-size: 12px;

      margin-bottom: 2px;
    }


    .success-value {
      color: #4C514D;

      font-weight: 600;
    }


    .success-notice {
      margin-top: 15px;

      padding: 12px;

      border-radius: 9px;

      background: #F1F8F3;

      color: #3F6257;

      text-align: center;

      font-size: 13px;

      line-height: 1.7;
    }


    /* ==================================================
       LINE STATUS
    ================================================== */

    .line-status {
      margin-top: 13px;

      padding:
        0 5px;

      font-size: 12px;

      color: #71847B;

      text-align: center;

      line-height: 1.6;
    }


    .line-status.success-status {
      color: #3F6257;
    }


    .line-status.error-status {
      color: #D66F69;
    }


    /* ==================================================
       TABLET
    ================================================== */

    @media (min-width: 600px) {

      .header {
        padding:
          36px 32px;
      }


      .container {
        padding:
          34px 24px 50px;
      }


      .booking-card {
        padding:
          30px;
      }


      .times {
        grid-template-columns:
          repeat(4, minmax(0, 1fr));

        gap: 10px;
      }


      .time-button {
        min-height: 50px;
      }

    }


    /* ==================================================
       DESKTOP
    ================================================== */

    @media (min-width: 900px) {

      .header {
        padding:
          38px 30px;
      }


      .container {
        padding:
          45px 30px 70px;
      }


      .booking-card {
        padding:
          34px;

        border-radius: 20px;

        box-shadow:
          0 15px 45px
          rgba(63, 98, 87, 0.10);
      }


      .section-title {
        font-size: 22px;
      }


      .section-description {
        font-size: 14px;
      }


      .times {
        grid-template-columns:
          repeat(4, minmax(0, 1fr));

        gap: 11px;
      }


      .time-button {
        min-height: 52px;
      }


      .submit {
        min-height: 56px;

        font-size: 18px;
      }

    }


    /* ==================================================
       SMALL PHONE
    ================================================== */

    @media (max-width: 359px) {

      .header {
        padding-left: 18px;
        padding-right: 18px;
      }


      .container {
        padding:
          18px 12px 35px;
      }


      .booking-card {
        padding:
          18px 14px 20px;

        border-radius: 15px;
      }


      .section-title {
        font-size: 18px;
      }


      .times {
        gap: 7px;
      }


      .time-button {
        min-height: 45px;

        font-size: 14px;
      }

    }


    /* ==================================================
       REDUCE MOTION
    ================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration:
          .01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          .01ms !important;
      }

    }

  </style>

</head>


<body>


  <!-- ==================================================
       HEADER
  ================================================== -->

  <header class="header">

    <div class="header-inner">

      <div class="header-small">
        ITSNONO_STUDIO
      </div>

      <div class="header-title">
        線上預約
      </div>

      <div class="header-sub">
        ONLINE RESERVATION
      </div>

    </div>

  </header>


  <!-- ==================================================
       MAIN
  ================================================== -->

  <main class="container">

    <section class="booking-card">


      <div class="section-title">
        預約服務
      </div>


      <div class="section-description">
        請選擇服務、日期與方便的時間，我們會為您保留預約。
      </div>


      <!-- ==================================================
           SERVICE
      ================================================== -->

      <div class="form-group">

        <label for="service">
          選擇服務
        </label>


        <select id="service">

          <option
            value="三段深層淨膚課程"
            data-price="2500"
          >
            三段深層淨膚課程｜$2,500
          </option>

        </select>

      </div>


      <!-- ==================================================
           DATE
      ================================================== -->

      <div class="form-group">

        <label for="date">
          選擇日期
        </label>


        <input
          type="date"
          id="date"
          class="date-input"
        >

      </div>


      <!-- ==================================================
           TIME
      ================================================== -->

      <div class="time-wrapper">

        <label for="times">
          選擇時間
        </label>


        <div
          id="times"
          class="times"
        >

          <div class="no-time">
            請先選擇日期
          </div>

        </div>

      </div>


      <!-- ==================================================
           NAME
      ================================================== -->

      <div class="form-group">

        <label for="name">
          姓名
        </label>


        <input
          type="text"
          id="name"
          placeholder="請輸入姓名"
          autocomplete="name"
        >

      </div>


      <!-- ==================================================
           PHONE
      ================================================== -->

      <div class="form-group">

        <label for="phone">
          電話
        </label>


        <input
          type="tel"
          id="phone"
          placeholder="請輸入聯絡電話"
          autocomplete="tel"
          inputmode="tel"
        >

      </div>


      <!-- ==================================================
           SUBMIT
      ================================================== -->

      <button
        id="submitButton"
        class="submit"
        type="button"
      >
        確認預約
      </button>


      <!-- ==================================================
           MESSAGE
      ================================================== -->

      <div
        id="message"
        class="message"
      ></div>


      <!-- ==================================================
           LINE STATUS
      ================================================== -->

      <div
        id="lineStatus"
        class="line-status"
      >
        LINE SDK 載入中...
      </div>


    </section>

  </main>


  <!-- ==================================================
       LIFF SDK
       ★ 一定要放在自己的 JavaScript 前面
  ================================================== -->

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>
  window.addEventListener('load', function () {
    setMinimumDate();

    // 等待 LIFF SDK 載入
    waitForLiffSDK();
  });

  function waitForLiffSDK() {

    const status = document.getElementById('lineStatus');

    if (typeof liff !== 'undefined') {

      console.log('========== LIFF SDK LOADED ==========');
      console.log('LIFF SDK:', liff);

      status.innerText = 'LINE 初始化中...';

      initLIFF();

      return;
    }

    // 如果 SDK 還沒載入，繼續等待
    setTimeout(function () {
      waitForLiffSDK();
    }, 300);

  }
</script>


  <script>

    /* ==================================================
       LIFF ID

       ★★★ 請換成真正的 LIFF ID ★★★

       例如：

       const LIFF_ID = '2001234567-AbCdEfGh';

    ================================================== */

    const LIFF_ID =
      '2011369014-AgBGN7fg';


    /* ==================================================
       GLOBAL
    ================================================== */

    let selectedTime = '';

    let lineUserId = '';

    let liffReady = false;

    /* ==================================================
       DATE CHANGE
    ================================================== */

    document
      .getElementById('date')
      .addEventListener(
        'change',
        loadTimes
      );


    /* ==================================================
       SUBMIT
    ================================================== */

    document
      .getElementById('submitButton')
      .addEventListener(
        'click',
        submitReservation
      );


    /* ==================================================
       LIFF SDK LOADED
    ================================================== */

    function onLiffSDKLoaded() {

      console.log(
        '========== LIFF SDK LOADED =========='
      );


      console.log(
        'typeof liff:',
        typeof liff
      );


      const status =
        document.getElementById(
          'lineStatus'
        );


      if (
        typeof liff === 'undefined'
      ) {

        onLiffSDKError();

        return;

      }


      status.innerText =
        'LINE 初始化中...';


      initLIFF();

    }


    /* ==================================================
       LIFF SDK ERROR
    ================================================== */

    function onLiffSDKError() {

      console.error(
        '========== LIFF SDK LOAD ERROR =========='
      );


      const status =
        document.getElementById(
          'lineStatus'
        );


      status.innerText =
        'LINE SDK 載入失敗';


      status.classList.add(
        'error-status'
      );


      showLineError(
        'LINE SDK 無法載入。' +
        '請確認網路連線，以及此頁面是否使用 HTTPS。'
      );

    }


    /* ==================================================
       INIT LIFF
    ================================================== */

    async function initLIFF() {

      const status =
        document.getElementById(
          'lineStatus'
        );


      try {

        /* ------------------------------------------
           檢查 LIFF ID
        ------------------------------------------ */

        console.log(
          'LIFF_ID:',
          LIFF_ID
        );


        console.log(
          '目前網址:',
          window.location.href
        );


        /* ------------------------------------------
           LIFF INIT
        ------------------------------------------ */

        status.innerText =
          'LINE 初始化中...';


        console.log(
          '開始 liff.init()'
        );


        const timeoutPromise =
          new Promise(
            function (_, reject) {

              setTimeout(
                function () {

                  reject(
                    new Error(
                      'LIFF 初始化超過 20 秒沒有回應。請檢查 LIFF Endpoint URL 是否正確。'
                    )
                  );

                },
                20000
              );

            }
          );


        await Promise.race(
          [
            liff.init({
              liffId:
                LIFF_ID
            }),

            timeoutPromise
          ]
        );


        console.log(
          '========== LIFF INIT SUCCESS =========='
        );


        /* ------------------------------------------
           一般瀏覽器
        ------------------------------------------ */

        if (
          !liff.isInClient()
        ) {

          console.log(
            '目前不是 LINE App 內建瀏覽器'
          );


          status.innerText =
            '一般瀏覽器模式';


          status.classList.remove(
            'error-status'
          );


          status.classList.add(
            'success-status'
          );


          showLineNotice(
            '目前是一般瀏覽器模式。' +
            '<br><br>' +
            '如果要取得 LINE UID，請從 LINE 官方帳號的「立即預約」按鈕開啟此頁面。'
          );


          return;

        }


        /* ------------------------------------------
           LINE App
        ------------------------------------------ */

        console.log(
          '目前在 LINE App 內'
        );


        status.innerText =
          '確認 LINE 登入狀態...';


        /* ------------------------------------------
           LOGIN
        ------------------------------------------ */

        if (
          !liff.isLoggedIn()
        ) {

          console.log(
            'LINE 尚未登入'
          );


          status.innerText =
            '正在登入 LINE...';


          liff.login({
            redirectUri:
              window.location.href
          });


          return;

        }


        /* ------------------------------------------
           GET PROFILE
        ------------------------------------------ */

        status.innerText =
          '取得 LINE 使用者資料...';


        console.log(
          '開始取得 LINE Profile'
        );


        const profile =
          await liff.getProfile();


        console.log(
          'LINE PROFILE:',
          profile
        );


        /* ------------------------------------------
           CHECK UID
        ------------------------------------------ */

        if (
          !profile ||
          !profile.userId
        ) {

          throw new Error(
            'LINE Profile 取得成功，但沒有 LINE User ID。'
          );

        }


        /* ------------------------------------------
           SAVE UID
        ------------------------------------------ */

        lineUserId =
          profile.userId;


        liffReady =
          true;


        /* ------------------------------------------
           READY
        ------------------------------------------ */

        status.innerText =
          '✓ LINE 已連線';


        status.classList.remove(
          'error-status'
        );


        status.classList.add(
          'success-status'
        );


        document
          .getElementById('message')
          .innerHTML =
            '';


        console.log(
          '========== LINE READY =========='
        );


        console.log(
          'LINE UID:',
          lineUserId
        );

      }

      catch (error) {

        console.error(
          '========== LIFF ERROR =========='
        );


        console.error(
          error
        );


        status.innerText =
          'LINE 初始化失敗';


        status.classList.remove(
          'success-status'
        );


        status.classList.add(
          'error-status'
        );


        showLineError(
          error.message ||
          String(error)
        );

      }

    }


    /* ==================================================
       LINE NOTICE
    ================================================== */

    function showLineNotice(text) {

      const message =
        document.getElementById(
          'message'
        );


      message.innerHTML =

        '<div class="success">' +

          '<div class="success-title">' +
            'LINE 預約提醒' +
          '</div>' +

          '<div class="success-notice">' +
            text +
          '</div>' +

        '</div>';

    }


    /* ==================================================
       LINE ERROR
    ================================================== */

    function showLineError(
      errorMessage
    ) {

      const message =
        document.getElementById(
          'message'
        );


      message.innerHTML =

        '<div class="success">' +

          '<div class="success-title">' +
            'LINE 連線異常' +
          '</div>' +

          '<div class="success-notice">' +

            '<strong>錯誤訊息</strong><br>' +

            escapeHtml(
              errorMessage
            ) +

            '<br><br>' +

            '<strong>請確認：</strong><br><br>' +

            '① LIFF ID 是否正確<br>' +

            '② LIFF Endpoint URL 是否正確<br>' +

            '③ LINE Login Channel 是否啟用<br>' +

            '④ 是否從 LINE 官方帳號的 LIFF 按鈕開啟<br>' +

            '⑤ GAS Web App 是否部署為「任何人」可存取<br>' +

          '</div>' +

        '</div>';

    }


    /* ==================================================
       HTML ESCAPE
    ================================================== */

    function escapeHtml(value) {

      return String(value)

        .replace(
          /&/g,
          '&amp;'
        )

        .replace(
          /</g,
          '&lt;'
        )

        .replace(
          />/g,
          '&gt;'
        )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#039;'
        );

    }


    /* ==================================================
       MINIMUM DATE
    ================================================== */

    function setMinimumDate() {

      const dateInput =
        document.getElementById(
          'date'
        );


      const now =
        new Date();


      const year =
        now.getFullYear();


      const month =
        String(
          now.getMonth() + 1
        ).padStart(
          2,
          '0'
        );


      const day =
        String(
          now.getDate()
        ).padStart(
          2,
          '0'
        );


      const today =
        year +
        '-' +
        month +
        '-' +
        day;


      dateInput.min =
        today;

    }


    /* ==================================================
       LOAD AVAILABLE TIMES
    ================================================== */

    function loadTimes() {

      selectedTime =
        '';


      const date =
        document
          .getElementById('date')
          .value;


      const container =
        document
          .getElementById('times');


      if (!date) {

        container.innerHTML =

          '<div class="no-time">' +
            '請先選擇日期' +
          '</div>';

        return;

      }


      container.innerHTML =

        '<div class="no-time">' +

          '<span class="loading">' +

            '<span class="loading-dot"></span>' +

            '<span class="loading-dot"></span>' +

            '<span class="loading-dot"></span>' +

            '讀取可預約時段' +

          '</span>' +

        '</div>';


      google.script.run

        .withSuccessHandler(
          function (times) {

            container.innerHTML =
              '';


            if (
              !times ||
              times.length === 0
            ) {

              container.innerHTML =

                '<div class="no-time">' +
                  '這天沒有可預約時段' +
                '</div>';

              return;

            }


            times.forEach(
              function (time) {

                const button =
                  document.createElement(
                    'button'
                  );


                button.type =
                  'button';


                button.className =
                  'time-button';


                button.innerText =
                  time;


                button.onclick =
                  function () {

                    selectedTime =
                      time;


                    document
                      .querySelectorAll(
                        '.time-button'
                      )
                      .forEach(
                        function (btn) {

                          btn.classList.remove(
                            'selected'
                          );

                        }
                      );


                    button.classList.add(
                      'selected'
                    );

                  };


                container.appendChild(
                  button
                );

              }
            );

          }
        )


        .withFailureHandler(
          function (error) {

            console.error(
              'getAvailableTimes ERROR:',
              error
            );


            container.innerHTML =

              '<div class="no-time">' +
                '讀取失敗，請重新整理頁面後再試。' +
              '</div>';

          }
        )


        .getAvailableTimes(
          date
        );

    }


    /* ==================================================
       SUBMIT RESERVATION
    ================================================== */

    function submitReservation() {

      const date =
        document
          .getElementById('date')
          .value;


      const name =
        document
          .getElementById('name')
          .value
          .trim();


      const phone =
        document
          .getElementById('phone')
          .value
          .trim();


      const serviceElement =
        document.getElementById(
          'service'
        );


      const service =
        serviceElement.value;


      const price =
        serviceElement
          .selectedOptions[0]
          .dataset.price;


      const button =
        document.getElementById(
          'submitButton'
        );


      const message =
        document.getElementById(
          'message'
        );


      /* ------------------------------------------
         LINE CHECK
      ------------------------------------------ */

      if (
        !lineUserId ||
        !liffReady
      ) {

        alert(
          'LINE 尚未連線，請從 LINE 官方帳號的「立即預約」按鈕開啟此頁面。'
        );

        return;

      }


      /* ------------------------------------------
         DATE
      ------------------------------------------ */

      if (!date) {

        alert(
          '請選擇日期'
        );


        document
          .getElementById('date')
          .focus();


        return;

      }


      /* ------------------------------------------
         TIME
      ------------------------------------------ */

      if (!selectedTime) {

        alert(
          '請選擇時間'
        );

        return;

      }


      /* ------------------------------------------
         NAME
      ------------------------------------------ */

      if (!name) {

        alert(
          '請輸入姓名'
        );


        document
          .getElementById('name')
          .focus();


        return;

      }


      /* ------------------------------------------
         PHONE
      ------------------------------------------ */

      if (!phone) {

        alert(
          '請輸入電話'
        );


        document
          .getElementById('phone')
          .focus();


        return;

      }


      /* ------------------------------------------
         PREVENT DOUBLE CLICK
      ------------------------------------------ */

      button.disabled =
        true;


      button.innerText =
        '預約處理中...';


      message.innerHTML =
        '';


      /* ------------------------------------------
         CREATE RESERVATION
      ------------------------------------------ */

      google.script.run

        .withSuccessHandler(
          function (result) {

            button.disabled =
              false;


            button.innerText =
              '確認預約';


            /* ======================================
               SUCCESS
            ====================================== */

            if (
              result &&
              result.success
            ) {

              message.innerHTML =

                '<div class="success">' +

                  '<div class="success-title">' +
                    '🎉 預約成功！' +
                  '</div>' +

                  '<div class="reservation-id">' +

                    escapeHtml(
                      result.reservationId
                    ) +

                  '</div>' +

                  '<div class="success-info">' +

                    '<div class="success-row">' +

                      '<div class="success-label">' +
                        '日期' +
                      '</div>' +

                      '<div class="success-value">' +

                        escapeHtml(
                          result.date
                        ) +

                      '</div>' +

                    '</div>' +


                    '<div class="success-row">' +

                      '<div class="success-label">' +
                        '時間' +
                      '</div>' +

                      '<div class="success-value">' +

                        escapeHtml(
                          result.time
                        ) +

                      '</div>' +

                    '</div>' +


                    '<div class="success-row">' +

                      '<div class="success-label">' +
                        '服務' +
                      '</div>' +

                      '<div class="success-value">' +

                        escapeHtml(
                          result.service
                        ) +

                      '</div>' +

                    '</div>' +


                    '<div class="success-row">' +

                      '<div class="success-label">' +
                        '價格' +
                      '</div>' +

                      '<div class="success-value">' +

                        '$' +

                        escapeHtml(
                          result.price
                        ) +

                      '</div>' +

                    '</div>' +

                  '</div>' +


                  '<div class="success-notice">' +
                    '預約確認通知已傳送至您的 LINE。' +
                  '</div>' +

                '</div>';


              /* --------------------------------------
                 RESET
              -------------------------------------- */

              selectedTime =
                '';


              document
                .getElementById('date')
                .value =
                '';


              document
                .getElementById('times')
                .innerHTML =

                  '<div class="no-time">' +
                    '請先選擇日期' +
                  '</div>';


              document
                .getElementById('name')
                .value =
                '';


              document
                .getElementById('phone')
                .value =
                '';


              setTimeout(
                function () {

                  message.scrollIntoView({

                    behavior:
                      'smooth',

                    block:
                      'center'

                  });

                },
                100
              );

            }


            /* ======================================
               FAILED
            ====================================== */

            else {

              alert(

                result &&
                result.message

                  ? result.message

                  : '預約失敗，請稍後再試。'

              );


              loadTimes();

            }

          }
        )


        .withFailureHandler(
          function (error) {

            button.disabled =
              false;


            button.innerText =
              '確認預約';


            console.error(
              'createReservation ERROR:',
              error
            );


            alert(
              '系統發生錯誤，請稍後再試。'
            );

          }
        )


        .createReservation({

          date:
            date,

          time:
            selectedTime,

          service:
            service,

          price:
            price,

          name:
            name,

          phone:
            phone,

          lineUserId:
            lineUserId

        });

    }

  </script>
