<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ITSNONO｜預約系統管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">

<style>
:root {
  color-scheme: light;
  --bg: #FAF8F5;
  --card: #FFFFFF;
  --pill: #F5F0EA;
  --ink: #51433C;
  --mute: #8B7C73;
  --line: #E0D3C8;
  --warn: #A8741A;
  --ok: #5F7355;
  --bad: #A8473B;
  --serif: "Noto Serif TC", "Songti TC", serif;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.65 system-ui, -apple-system, BlinkMacSystemFont,
    "PingFang TC", "Noto Sans TC", sans-serif;
}

button, input, select, textarea {
  box-sizing: border-box;
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

main {
  width: 100%;
  max-width: 560px;
  min-height: 100vh;
  margin: 0 auto;
  padding: 22px 16px 110px;
}

[hidden] {
  display: none !important;
}

/* 品牌標題 */
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 26px;
}

.logo {
  font-family: var(--serif);
  font-size: 19px;
  letter-spacing: .32em;
  font-weight: 500;
  color: var(--ink);
}

.logo small {
  display: block;
  margin-top: 3px;
  font-size: 11px;
  letter-spacing: .2em;
  color: var(--mute);
  font-family: system-ui, sans-serif;
}

/* 登入 / 修改密碼 */
#login,
#pwscreen {
  padding-top: 46px;
}

#login > .logo,
#pwscreen > .logo {
  padding: 0 4px 20px;
}

#login .card,
#pwscreen .card {
  margin-top: 12px;
}

/* 標題 */
h1 {
  font: 600 28px/1.35 var(--serif);
  margin: 0 0 8px;
  letter-spacing: .04em;
  color: var(--ink);
}

.sub {
  color: var(--mute);
  margin: 0 0 22px;
  font-size: 14px;
  line-height: 1.8;
}

/* 頁籤 */
.pills {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 3px 2px 9px;
  margin: 0 0 18px;
  scrollbar-width: none;
}

.pills::-webkit-scrollbar {
  display: none;
}

.pill {
  flex: 0 0 auto;
  padding: 10px 17px;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: var(--pill);
  color: var(--ink);
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  transition: background .2s, color .2s;
}

.pill.on {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--card);
}

.pill.s {
  padding: 7px 13px;
  font-size: 13px;
}

/* 卡片框線 */
.card {
  min-width: 0;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 2px 8px rgba(81, 67, 60, .035);
}

/* 橫向排列 */
.row {
  display: flex;
  gap: 9px;
  align-items: center;
  flex-wrap: wrap;
  min-width: 0;
}

.sp {
  justify-content: space-between;
}

.mute {
  color: var(--mute);
  font-size: 13px;
}

/* 表單 */
input,
select,
textarea {
  min-width: 0;
  max-width: 100%;
  padding: 11px 12px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  font-family: inherit;
  outline: none;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--mute);
  box-shadow: 0 0 0 3px rgba(139, 124, 115, .10);
}

input.w {
  flex: 1 1 160px;
  width: 100%;
}

textarea {
  display: block;
  width: 100%;
  resize: vertical;
  margin-top: 10px;
  line-height: 1.7;
}

/* 按鈕 */
.b {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  padding: 10px 16px;
  border: 1px solid var(--ink);
  border-radius: 99px;
  background: var(--ink);
  color: var(--card);
  font-size: 14px;
  font-family: inherit;
  line-height: 1.5;
  cursor: pointer;
  white-space: nowrap;
}

.b.g {
  background: var(--card);
  border-color: var(--line);
  color: var(--ink);
}

.b.d {
  background: var(--card);
  border-color: var(--bad);
  color: var(--bad);
}

.b.sm {
  padding: 7px 12px;
  font-size: 13px;
}

button:disabled {
  opacity: .4;
  cursor: default;
}

/* 狀態標籤 */
.tag {
  display: inline-block;
  flex: 0 0 auto;
  font-size: 12px;
  padding: 2px 10px;
  border-radius: 99px;
  border: 1px solid currentColor;
  white-space: nowrap;
}

.t-待確認 {
  color: var(--warn);
}

.t-已預約 {
  color: var(--ok);
}

.t-已取消 {
  color: var(--mute);
}

/* 預約項目 */
.bk {
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
}

.bk:first-child {
  padding-top: 2px;
}

.bk:last-child {
  border: 0;
  padding-bottom: 0;
}

.bk.x {
  opacity: .6;
}

.bk .row {
  gap: 8px;
}

.bk a {
  color: var(--ink);
  text-decoration-color: var(--line);
  text-underline-offset: 3px;
  overflow-wrap: anywhere;
}

.bk .mute {
  margin-top: 4px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.dh {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-family: var(--serif);
  font-weight: 600;
  margin: 20px 0 7px;
}

.dh.now {
  color: var(--warn);
}

.none {
  margin: 8px 0 2px;
  padding: 10px 0;
}

/* 日期導覽 */
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 14px 0;
}

.nav b {
  font-family: var(--serif);
  font-size: 16px;
  text-align: center;
}

.nav button.r {
  flex: 0 0 38px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-size: 21px;
  line-height: 1;
  cursor: pointer;
}

/* 月曆 */
.grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 5px;
  text-align: center;
}

.wh {
  font-size: 12px;
  color: var(--mute);
  padding: 5px 0;
}

.c {
  width: 100%;
  min-width: 0;
  aspect-ratio: 1 / 1.05;
  border: 1px solid transparent;
  border-radius: 12px;
  background: transparent;
  color: var(--ink);
  font: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  cursor: pointer;
  padding: 0;
}

.c b {
  font-weight: 500;
  font-size: 15px;
}

.c i {
  font-style: normal;
  font-size: 11px;
  color: var(--mute);
  min-height: 15px;
  line-height: 15px;
}

.c i.n {
  background: var(--pill);
  color: var(--ink);
  border-radius: 99px;
  padding: 0 7px;
}

.c i.p {
  background: var(--warn);
  color: #fff;
}

.c.today b {
  text-decoration: underline;
  text-underline-offset: 3px;
}

.c.sel {
  background: var(--ink);
  color: var(--card);
}

.c.sel i {
  color: var(--card);
}

.c.sel i.n {
  background: var(--card);
  color: var(--ink);
}

.c.dy {
  box-shadow: inset 0 -3px 0 var(--warn);
}

.c:disabled {
  opacity: .25;
  cursor: default;
}

/* 時段選擇 */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 14px 0;
}

.chip {
  padding: 9px 14px;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
}

.chip.on {
  background: var(--ink);
  color: var(--card);
  border-color: var(--ink);
}

/* 服務價格欄位 */
.f3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 9px;
  margin: 14px 0;
}

.f3 label {
  display: block;
  min-width: 0;
  font-size: 12px;
  line-height: 1.7;
  color: var(--mute);
}

.f3 input {
  display: block;
  width: 100%;
  min-width: 0;
  margin-top: 5px;
  padding: 10px 7px;
}

/* 底部儲存列 */
.bar {
  position: fixed;
  z-index: 5;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: rgba(255, 255, 255, .96);
  border-top: 1px solid var(--line);
  box-shadow: 0 -4px 18px rgba(81, 67, 60, .06);
  backdrop-filter: blur(12px);
}

.bar .b {
  display: flex;
  width: 100%;
  max-width: 528px;
  margin: 0 auto;
  padding: 13px;
}

/* 提示訊息 */
#toast {
  position: fixed;
  left: 50%;
  top: calc(14px + env(safe-area-inset-top, 0px));
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--card);
  padding: 11px 20px;
  border: 1px solid var(--line);
  border-radius: 99px;
  font-size: 14px;
  max-width: calc(100% - 32px);
  z-index: 20;
  box-shadow: 0 5px 20px rgba(0, 0, 0, .12);
  text-align: center;
}

a {
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--warn);
  outline-offset: 3px;
}

/* 已完成、系統備註、儲值金、對話框 */
.t-已完成 {
  color: #4F6F9A;
}

.sys {
  margin-top: 8px;
  padding: 9px 11px;
  border-radius: 10px;
  background: var(--pill);
  color: var(--mute);
  font-size: 12.5px;
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.sys b {
  display: block;
  margin-bottom: 2px;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .06em;
}

.bal {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0 4px;
}

.bal .tag {
  color: var(--ink);
  font-size: 13px;
  padding: 3px 12px;
}

.adj {
  margin-top: 10px;
}

.adj input[type=number] {
  width: 96px;
}

.chip.part {
  border-style: dashed;
}

.chip.rm {
  padding: 9px 11px;
  color: var(--mute);
  margin-left: -6px;
}

.ov {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(81, 67, 60, .38);
}

.sheet {
  width: 100%;
  max-width: 560px;
  max-height: 88vh;
  overflow: auto;
  margin: 0;
  border-radius: 20px 20px 0 0;
  padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px));
}

.opt {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin-bottom: 9px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
}

.opt input[type=radio] {
  margin-top: 5px;
}

.opt.off {
  opacity: .45;
}

#stamp {
  font-size: 12px;
}

/* 手機版 */
@media (max-width: 380px) {
  main {
    padding: 18px 12px 105px;
  }

  .card {
    padding: 14px;
    border-radius: 15px;
  }

  .pill {
    padding: 9px 13px;
  }

  .f3 {
    gap: 6px;
  }

  .f3 input {
    font-size: 15px;
    padding: 9px 5px;
  }

  .bk .row.sp {
    align-items: flex-start;
  }
}
</style>
</head>

<body>
<main>

<div id="login">
  <div class="logo">ITSNONO<small>預約系統管理</small></div>
  <div class="card" style="margin-top:28px">
    <p class="mute" style="margin-top:0">輸入後台密碼</p>
    <div class="row">
      <input id="pw" type="password" class="w" autocomplete="current-password">
      <button class="b" id="go">登入</button>
    </div>
  </div>
</div>

<!-- 修改密碼（第一次用預設密碼登入時強制出現；登入後也可從右上角進入） -->
<div id="pwscreen" hidden>
  <div class="logo">ITSNONO<small>預約系統管理</small></div>
  <div class="card" style="margin-top:28px">
    <p id="pwtitle" style="margin:0 0 4px;font-weight:600"></p>
    <p class="mute" id="pwhint" style="margin-top:0"></p>

    <div id="pw-old-wrap">
      <p class="mute">目前的密碼</p>
      <input id="pw-old" type="password" style="width:100%;margin-bottom:12px" autocomplete="current-password">
    </div>

    <div id="pw-code-wrap" hidden>
      <p class="mute">設定碼（請到試算表「後台設定」分頁，複製 B1 儲存格）</p>
      <input id="pw-code" style="width:100%;margin-bottom:12px" autocomplete="off">
    </div>

    <p class="mute">新密碼（至少 8 個字元）</p>
    <input id="pw-new" type="password" style="width:100%;margin-bottom:12px" autocomplete="new-password">

    <p class="mute">確認新密碼</p>
    <input id="pw-new2" type="password" style="width:100%;margin-bottom:14px" autocomplete="new-password">

    <div class="row">
      <button class="b" id="pw-save">儲存</button>
      <button class="b g" id="pw-cancel" hidden>取消</button>
    </div>
  </div>
</div>

<div id="app" hidden>
  <div class="top">
    <div class="logo">ITSNONO<small>預約系統管理</small></div>
    <div class="row">
      <span class="tag t-待確認" id="rolebadge" hidden>維護模式</span>
      <span class="mute" id="stamp"></span>
      <button class="b g sm" id="rf">↻ 更新</button>
      <button class="b g sm" id="chg">修改密碼</button>
      <button class="b g sm" id="out">登出</button>
    </div>
  </div>

  <h1 id="title"></h1>
  <p class="sub" id="subt"></p>

  <div class="pills" id="tabs">
    <button class="pill on" data-t="bookings">預約系統</button>
    <button class="pill" data-t="hours">營業時間</button>
    <button class="pill" data-t="services">服務項目</button>
    <button class="pill" data-t="members">會員資料</button>
  </div>

  <section id="p-bookings">
    <div class="row sp">
      <div class="row" id="modes">
        <button class="pill s on" data-m="day">日</button>
        <button class="pill s" data-m="week">週</button>
        <button class="pill s" data-m="month">月</button>
      </div>
      <select id="bf">
        <option value="all">全部狀態</option>
        <option>待確認</option>
        <option>已預約</option>
        <option>已完成</option>
        <option>已取消</option>
      </select>
    </div>

    <div class="nav">
      <button class="r" id="bp" aria-label="上一個">‹</button>
      <div class="row">
        <b id="blabel"></b>
        <button class="b g sm" id="bt">今天</button>
      </div>
      <button class="r" id="bn" aria-label="下一個">›</button>
    </div>

    <div class="card" id="bview"></div>
  </section>

  <section id="p-hours" hidden>
    <div class="card">
      <div class="nav" style="margin-top:0">
        <button class="r" id="hp" aria-label="上個月">‹</button>
        <b id="hlabel"></b>
        <button class="r" id="hn" aria-label="下個月">›</button>
      </div>

      <div id="hgrid"></div>

      <div class="row" id="hsel" style="margin-top:16px">
        <span class="mute">快速選取</span>
        <button class="pill s" data-s="wk">平日</button>
        <button class="pill s" data-s="we">週末</button>
        <button class="pill s" data-s="all">整月</button>
        <button class="pill s" data-s="clear">清除</button>
      </div>

      <p class="mute" style="margin:12px 0 0">
        格子上的數字是當天時段數，「休」是休息，底線是尚未儲存。
      </p>
    </div>

    <div class="card" id="hed" hidden>
      <b id="hcount"></b>
      <p class="mute" style="margin:4px 0 0">點時段切換選取。清單裡沒有的時段，可在下方輸入後加入。</p>
      <div class="chips" id="hchips"></div>
      <div class="row">
        <input type="time" id="hT">
        <button class="b g sm" id="hAdd">加入新時段</button>
      </div>
      <div class="row" style="margin-top:16px">
        <button class="b" id="hApply">套用到所選日期</button>
        <button class="b g" id="hPlus" hidden>加到這些日期</button>
        <button class="b g d" id="hMinus" hidden>從這些日期移除</button>
        <button class="b g" id="hOff">設為休息</button>
      </div>
    </div>
  </section>

  <section id="p-services" hidden>
    <div class="row" style="margin-bottom:14px" id="sf">
      <button class="pill s on" data-f="all">全部</button>
      <button class="pill s" data-f="on">啟用中</button>
      <button class="pill s" data-f="off">已停用</button>
      <span style="flex:1"></span>
      <button class="b sm" id="sAdd">新增服務</button>
    </div>
    <div id="slist"></div>
  </section>

  <section id="p-members" hidden>
    <input id="mq" style="width:100%;margin-bottom:14px" placeholder="搜尋姓名或電話">
    <div id="mlist"></div>
  </section>

  <div class="bar" id="bar" hidden>
    <button class="b" id="save"></button>
  </div>
</div>

<div class="ov" id="dlg" hidden>
  <div class="card sheet">
    <b id="dlg-t"></b>
    <p class="mute" id="dlg-s" style="margin:4px 0 14px"></p>
    <div id="dlg-opts"></div>
    <div class="row" style="margin-top:6px">
      <button class="b" id="dlg-ok">確認完成</button>
      <button class="b g" id="dlg-x">取消</button>
    </div>
  </div>
</div>

<div id="toast" hidden></div>
</main>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbyowZ3EXmAyImLihpeBhn9wf7gqg29unT4zWZtfycsoB58IX_pFz2Fr9GWqOpRm1plBXQ/exec";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
}[c]));

const WN = "日一二三四五六";
const D = s => new Date(s + "T00:00:00Z");
const fmt = d => d.toISOString().slice(0,10);
const add = (s,n) => {
  const d = D(s);
  d.setUTCDate(d.getUTCDate()+n);
  return fmt(d);
};
const wd = s => D(s).getUTCDay();
const today = () => new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Taipei"});
const short = s => `${+s.slice(5,7)}/${+s.slice(8)}`;
const md = s => `${short(s)}（${WN[wd(s)]}）`;
const mStart = s => s.slice(0,8)+"01";
const addMonth = (s,n) => {
  const d = D(mStart(s));
  d.setUTCMonth(d.getUTCMonth()+n);
  return fmt(d);
};
const mDays = ms => new Date(Date.UTC(+ms.slice(0,4),+ms.slice(5,7),0)).getUTCDate();
const dayOf = (ms,d) => ms.slice(0,8)+String(d).padStart(2,"0");
const fixPhone = p => /^9\d{8}$/.test(p) ? "0"+p : p;
const mLabel = ms => `${ms.slice(0,4)} 年 ${+ms.slice(5,7)} 月`;

// 登入狀態：只存後端發的 session，不再存密碼
let session = "";
try {
  session = sessionStorage.getItem("session") || "";
  sessionStorage.removeItem("pw"); // 清掉舊版存的明文密碼
} catch(e) {}

let S = {hours:[],services:[],bookings:[],members:[]};
let svc = [], dirty = new Map(), tab = "bookings", tt;

const TITLES = {
  bookings:["預約系統","所有預約都在這裡，可切換日、週、月檢視。"],
  hours:["營業時間","點選日期，新增、刪除或調整時段，一次套用到多天。"],
  services:["服務項目","調整價格與時長；不再提供的服務可以停用或刪除。"],
  members:["會員資料","客戶的聯絡方式、儲值金／堂數，以及你自己的備註。"]
};

function toast(m) {
  const t = $("toast");
  t.textContent = m;
  t.hidden = false;
  clearTimeout(tt);
  tt = setTimeout(()=>t.hidden=true,2800);
}

/* ---------- API ---------- */

// 不帶 session 的原始請求（登入用）
async function post(action,data={}) {
  if (GAS_URL.indexOf("http") !== 0) {
    throw new Error("請先在 admin.html 設定 GAS_URL");
  }
  const res = await fetch(GAS_URL,{
    method:"POST",
    body:JSON.stringify({action,...data})
  });
  return res.json();
}

// 帶 session 的請求；過期或被要求先改密碼時回到登入頁
async function api(action,data={}) {
  const j = await post(action,{session,...data});
  if (!j.ok) {
    if (j.code === "SESSION_EXPIRED" || j.code === "MUST_CHANGE") {
      dropSession();
      showLogin();
    }
    throw new Error(j.error || "發生錯誤");
  }
  return j;
}

function setSession(t) {
  session = t;
  try { sessionStorage.setItem("session",t); } catch(e) {}
}

function dropSession() {
  session = "";
  try { sessionStorage.removeItem("session"); } catch(e) {}
}

function showLogin() {
  $("app").hidden = true;
  $("pwscreen").hidden = true;
  $("login").hidden = false;
  $("pw").value = "";
}

async function load() {
  S = await api("getAll");
  svc = S.services.map(s=>({...s}));
  renderAll();
}

/* ---------- 登入 / 修改密碼 ---------- */

async function enterApp() {
  await load();
  $("login").hidden = true;
  $("pwscreen").hidden = true;
  $("app").hidden = false;
  setTab("bookings");
}

async function login() {
  const typed = $("pw").value;
  if (!typed) return;

  $("go").disabled = true;
  try {
    const r = await post("login",{pw:typed});
    if (!r.ok) throw new Error(r.error || "登入失敗");

    setSession(r.session);
    $("pw").value = "";

    if (r.mustChange) {
      // 還在用預設密碼：必須先修改才能使用後台
      openPwScreen({forced:true,oldPw:typed,needCode:r.requireSetupCode});
    } else {
      await enterApp();
    }
  } catch(e) {
    toast(e.message);
  }
  $("go").disabled = false;
}

let PW = {forced:false,oldPw:"",needCode:false};

function openPwScreen(o) {
  PW = {forced:!!o.forced,oldPw:o.oldPw || "",needCode:!!o.needCode};

  $("login").hidden = true;
  $("app").hidden = true;
  $("pwscreen").hidden = false;

  $("pwtitle").textContent = PW.forced ? "請先修改密碼" : "修改密碼";
  $("pwhint").textContent = PW.forced
    ? "你正在使用預設密碼，請設定一組新的後台密碼。"
    : "";
  $("pw-old-wrap").hidden = PW.forced;
  $("pw-code-wrap").hidden = !PW.needCode;
  $("pw-cancel").hidden = PW.forced;

  ["pw-old","pw-code","pw-new","pw-new2"].forEach(id => $(id).value = "");
}

$("chg").onclick = () => openPwScreen({});

$("pw-cancel").onclick = () => {
  $("pwscreen").hidden = true;
  $("app").hidden = false;
};

$("pw-save").onclick = async () => {
  const b = $("pw-save");
  b.disabled = true;

  try {
    const r = await api("changePassword",{
      oldPassword: PW.forced ? PW.oldPw : $("pw-old").value,
      setupCode: PW.needCode ? $("pw-code").value : "",
      newPassword: $("pw-new").value,
      confirm: $("pw-new2").value
    });

    setSession(r.session); // 換了密碼，舊 session 失效，改用新的
    PW.oldPw = "";
    toast("密碼已更新");

    if (PW.forced) {
      await enterApp();
    } else {
      $("pwscreen").hidden = true;
      $("app").hidden = false;
    }
  } catch(e) {
    toast(e.message);
  }

  b.disabled = false;
};

$("go").onclick = login;
$("pw").onkeydown = e => {
  if (e.key === "Enter") login();
};

$("out").onclick = async () => {
  try { await post("logout",{session}); } catch(e) {}
  dropSession();
  location.reload();
};

// 重新整理頁面時，若 session 還有效就直接進後台
if (session) enterApp().catch(()=>{});

function setTab(t) {
  tab = t;
  document.querySelectorAll("#tabs .pill").forEach(x=>{
    x.classList.toggle("on",x.dataset.t===t);
  });
  ["bookings","hours","services","members"].forEach(k=>{
    $("p-"+k).hidden = k!==t;
  });
  $("title").textContent = TITLES[t][0];
  $("subt").textContent = TITLES[t][1];
  updBar();
}

$("tabs").onclick = e => {
  const b = e.target.closest("button[data-t]");
  if (b) setTab(b.dataset.t);
};

/* 預約：日／週／月 */
const V = {mode:"day",cur:today(),sel:today()};

function bkByDate() {
  const f = $("bf").value, m = {};
  S.bookings.forEach(b=>{
    if (f!=="all" && b["狀態"]!==f) return;
    (m[b["日期"]]=m[b["日期"]]||[]).push(b);
  });
  for (const k in m) {
    m[k].sort((a,b)=>a["時間"].localeCompare(b["時間"]));
  }
  return m;
}

const num = v => Number(String(v ?? "").replace(/[^\d.-]/g,"")) || 0;
const phoneKey = p => {
  const s = String(p || "").replace(/[-\s]/g,"").replace(/^\+?886/,"0");
  return /^9\d{8}$/.test(s) ? "0"+s : s;
};
const sysBox = t => t ? `<div class="sys"><b>系統紀錄</b>${esc(t)}</div>` : "";

function bkCard(b) {
  const st=b["狀態"], id=esc(b["預約編號"]);
  const btn=(act,label,cls="")=>`<button class="b sm ${cls}" data-act="${act}" data-id="${id}">${label}</button>`;
  const acts = st==="待確認" ? btn("ok","確認")+btn("no","取消","g d")
    : st==="已預約" ? btn("done","完成")+btn("no","取消","g d")
    : st==="已完成" ? btn("undo","撤銷完成","g")
    : btn("back","恢復預約","g");
  const used = b["扣抵"] ? "　已扣 "+esc(b["扣抵"]) : "";

  return `<div class="bk ${st==="已取消"?"x":""}">
    <div class="row sp">
      <b>${esc(b["時間"])}　${esc(b["服務"])}</b>
      <span class="tag t-${esc(st)}">${esc(st)}</span>
    </div>
    <div>${esc(b["姓名"])}・<a href="tel:${esc(fixPhone(b["電話"]))}">${esc(fixPhone(b["電話"]))}</a></div>
    <div class="mute">$${esc(b["價格"])}${b["訂金後五碼"]?"　後五碼 "+esc(b["訂金後五碼"]):""}${used}${b["備註"]?"　備註："+esc(b["備註"]):""}</div>
    ${sysBox((b["系統備註"]||"").trim())}
    <div class="row" style="margin-top:10px">${acts}</div>
  </div>`;
}

const bkList = a => a&&a.length
  ? a.map(bkCard).join("")
  : '<p class="mute none">這天沒有預約。</p>';

function renderBookings() {
  const m=bkByDate(), t=today();
  let html="",label="";

  if (V.mode==="day") {
    label=md(V.cur);
    html=bkList(m[V.cur]);
  } else if (V.mode==="week") {
    const s=add(V.cur,-wd(V.cur));
    label=`${short(s)} – ${short(add(s,6))}`;
    for (let i=0;i<7;i++) {
      const ds=add(s,i),a=m[ds];
      html+=`<div class="dh ${ds===t?"now":""}" style="${i?"":"margin-top:0"}">${md(ds)}<span class="mute">${a?a.length+" 筆":""}</span></div>`
        +(a?a.map(bkCard).join(""):'<div class="mute none">—</div>');
    }
  } else {
    const ms=mStart(V.cur);
    label=mLabel(ms);
    let g=WN.split("").map(c=>`<div class="wh">${c}</div>`).join("")
      +"<div></div>".repeat(wd(ms));

    for (let d=1;d<=mDays(ms);d++) {
      const ds=dayOf(ms,d);
      const a=(m[ds]||[]).filter(x=>x["狀態"]!=="已取消");
      const p=a.some(x=>x["狀態"]==="待確認");
      g+=`<button class="c ${ds===t?"today":""} ${ds===V.sel?"sel":""}" data-day="${ds}"><b>${d}</b><i class="${a.length?"n":""} ${p?"p":""}">${a.length||""}</i></button>`;
    }

    html=`<div class="grid">${g}</div><div class="dh">${md(V.sel)}</div>${bkList(m[V.sel])}`;
  }

  $("blabel").textContent=label;
  $("bview").innerHTML=html;
}

function shift(n) {
  if (V.mode==="day") V.cur=add(V.cur,n);
  else if (V.mode==="week") V.cur=add(V.cur,7*n);
  else {
    V.cur=addMonth(V.cur,n);
    V.sel=V.cur.slice(0,7)===today().slice(0,7)?today():V.cur;
  }
  renderBookings();
}

$("bp").onclick=()=>shift(-1);
$("bn").onclick=()=>shift(1);
$("bt").onclick=()=>{
  V.cur=V.sel=today();
  renderBookings();
};
$("bf").onchange=renderBookings;

$("modes").onclick=e=>{
  const b=e.target.closest("button[data-m]");
  if (!b) return;
  if (b.dataset.m==="month") V.sel=V.cur;
  else if (V.mode==="month") V.cur=V.sel;
  V.mode=b.dataset.m;
  document.querySelectorAll("#modes .pill").forEach(x=>{
    x.classList.toggle("on",x===b);
  });
  renderBookings();
};

$("bview").onclick=async e=>{
  const c=e.target.closest("button[data-day]");
  if (c) {
    V.sel=c.dataset.day;
    return renderBookings();
  }

  const b=e.target.closest("button[data-act]");
  if (!b) return;

  const act=b.dataset.act, id=b.dataset.id;
  const bk=S.bookings.find(x=>String(x["預約編號"])===id);
  if (!bk) return toast("找不到這筆預約，請按右上角更新");

  if (act==="done") return openDone(bk);

  const MAP={
    ok:["已預約","已確認"],
    no:["已取消","已取消，這個時段已開放給其他人預約"],
    undo:["已預約","已撤銷完成"],
    back:["待確認","已恢復為待確認"]
  };
  const [status,msg]=MAP[act];

  if (act==="no" && !confirm(`確定取消 ${bk["姓名"]} ${bk["日期"]} ${bk["時間"]} 的預約？\n取消後這個時段會開放給其他人預約。`)) return;
  if (act==="undo" && !confirm(`撤銷「完成」？${bk["扣抵"]?"\n已扣的儲值金／堂數會自動退回。":""}`)) return;

  b.disabled=true;
  try {
    const r=await api("setStatus",{id,status});
    await refresh();
    toast(r.notified===false?`${msg}（LINE 通知未送出：${r.notifyError}）`:msg);
  } catch(err) {
    toast(err.message);
    b.disabled=false;
  }
};

/* 完成預約：選擇是否扣儲值金／堂數 */
const DEPOSIT = 500; // 與預約頁的首次訂金金額一致
let DLG = null;

function openDone(bk) {
  const m=S.members.find(x=>phoneKey(x["電話"])===phoneKey(bk["電話"]));
  const wallet=m?num(m["儲值金餘額"]):0, sess=m?num(m["剩餘堂數"]):0;
  const price=num(bk["價格"]);
  const dep=bk["訂金後五碼"]?DEPOSIT:0;
  const amt=Math.max(price-dep,0);
  const pre=sess>0?"sessions":(wallet>0&&amt>0?"wallet":"none");

  DLG={id:bk["預約編號"]};
  $("dlg-t").textContent=`${bk["姓名"]}｜${md(bk["日期"])} ${bk["時間"]}`;
  $("dlg-s").textContent=`${bk["服務"]}　價格 $${price}${dep?`（已付訂金 $${dep}，預設扣款已折抵）`:""}${m?"":"　（找不到會員資料，無法扣抵）"}`;

  $("dlg-opts").innerHTML=`
    <label class="opt"><input type="radio" name="dm" value="none" ${pre==="none"?"checked":""}>
      <span>只標記完成，不扣儲值金／堂數</span></label>
    <label class="opt ${sess>0?"":"off"}"><input type="radio" name="dm" value="sessions" ${sess>0?"":"disabled"} ${pre==="sessions"?"checked":""}>
      <span>扣 1 堂<br><span class="mute">剩餘 ${sess} 堂 → ${Math.max(sess-1,0)} 堂</span></span></label>
    <label class="opt ${wallet>0?"":"off"}"><input type="radio" name="dm" value="wallet" ${wallet>0?"":"disabled"} ${pre==="wallet"?"checked":""}>
      <span>扣儲值金 $<input type="number" inputmode="numeric" id="dlg-amt" value="${amt}" style="width:100px"><br><span class="mute">餘額 $${wallet}</span></span></label>`;

  $("dlg-amt").oninput=()=>{
    const r=document.querySelector('#dlg input[value="wallet"]');
    if (r && !r.disabled) r.checked=true;
  };
  $("dlg").hidden=false;
}

$("dlg-x").onclick=()=>{
  $("dlg").hidden=true;
  DLG=null;
};

$("dlg").onclick=e=>{
  if (e.target===$("dlg")) $("dlg-x").onclick();
};

$("dlg-ok").onclick=async()=>{
  if (!DLG) return;

  const mode=(document.querySelector("#dlg input[name=dm]:checked")||{}).value||"none";
  const amount=mode==="wallet"?Number($("dlg-amt").value):0;
  const bt=$("dlg-ok");
  bt.disabled=true;

  try {
    const r=await api("completeBooking",{id:DLG.id,mode,amount});
    $("dlg").hidden=true;
    DLG=null;
    await refresh();
    toast(r.notified===false
      ? `已完成（LINE 通知未送出：${r.notifyError}）`
      : mode==="none" ? "已標記完成" : "已完成並扣抵，已通知客人");
  } catch(err) {
    toast(err.message);
  }

  bt.disabled=false;
};

/* 營業時間 */
const H={ms:mStart(today()),sel:new Set(),pick:new Set(),extra:new Set()};

const daySlots=ds=>{
  const h=S.hours.find(x=>x.date===ds);
  return h&&h.slots?h.slots.split(","):[];
};

function slotsInUse() {
  const s=new Set();
  S.hours.forEach(h=>h.slots&&h.slots.split(",").forEach(t=>s.add(t)));
  return s;
}

// 清單 = 所有日期用過的時段 + 剛新增還沒套用的時段，才不會有時段「藏起來」刪不掉
const chipTimes=()=>[...new Set([...slotsInUse(),...H.extra,...H.pick])].sort();

function renderHours() {
  const hm={};
  S.hours.forEach(h=>hm[h.date]=h);
  const t=today();

  $("hlabel").textContent=mLabel(H.ms);
  $("hp").disabled=H.ms<=mStart(t);

  let g=WN.split("").map(c=>`<div class="wh">${c}</div>`).join("")
    +"<div></div>".repeat(wd(H.ms));

  for (let d=1;d<=mDays(H.ms);d++) {
    const ds=dayOf(H.ms,d),h=hm[ds];
    const n=h?(h.slots?h.slots.split(",").length:"休"):"";
    g+=`<button class="c ${ds===t?"today":""} ${H.sel.has(ds)?"sel":""} ${dirty.has(ds)?"dy":""}" data-d="${ds}" ${ds<t?"disabled":""}><b>${d}</b><i>${n}</i></button>`;
  }

  const days=[...H.sel];
  const inUse=slotsInUse();
  const cnt={};
  days.forEach(ds=>daySlots(ds).forEach(x=>cnt[x]=(cnt[x]||0)+1));

  $("hgrid").innerHTML=`<div class="grid">${g}</div>`;
  $("hed").hidden=!days.length;
  $("hcount").textContent=`已選 ${days.length} 天${days.length>1?"（虛線＝只有部分日期有這個時段）":""}`;
  $("hApply").textContent=days.length>1?"覆蓋為所選時段":"儲存這天的時段";
  $("hPlus").hidden=$("hMinus").hidden=days.length<2;

  $("hchips").innerHTML=chipTimes().map(x=>{
    const part=days.length>1&&cnt[x]>0&&cnt[x]<days.length;
    const rm=inUse.has(x)?"":`<button class="chip rm" data-rm="${x}" aria-label="從清單移除 ${x}">×</button>`;
    return `<button class="chip ${H.pick.has(x)?"on":""} ${part?"part":""}" data-t="${x}">${x}</button>${rm}`;
  }).join("");
}

$("hp").onclick=()=>{
  H.ms=addMonth(H.ms,-1);
  renderHours();
};
$("hn").onclick=()=>{
  H.ms=addMonth(H.ms,1);
  renderHours();
};

$("hgrid").onclick=e=>{
  const b=e.target.closest("button[data-d]");
  if (!b) return;

  const ds=b.dataset.d;
  if (H.sel.has(ds)) H.sel.delete(ds);
  else H.sel.add(ds);

  // 選第一天時，把那天的時段帶進來（可再選更多天，把這個時段複製過去）
  if (H.sel.size===1) H.pick=new Set(daySlots([...H.sel][0]));
  renderHours();
};

$("hsel").onclick=e=>{
  const b=e.target.closest("button[data-s]");
  if (!b) return;

  const k=b.dataset.s,t=today();
  H.sel.clear();

  if (k!=="clear") {
    for (let d=1;d<=mDays(H.ms);d++) {
      const ds=dayOf(H.ms,d),w=wd(ds);
      if (ds<t) continue;
      if (k==="all"||(k==="wk"&&w>0&&w<6)||(k==="we"&&(w===0||w===6))) H.sel.add(ds);
    }
  }
  renderHours();
};

$("hchips").onclick=e=>{
  const r=e.target.closest("button[data-rm]");
  if (r) {
    H.extra.delete(r.dataset.rm);
    H.pick.delete(r.dataset.rm);
    return renderHours();
  }

  const b=e.target.closest("button[data-t]");
  if (!b) return;
  const t=b.dataset.t;
  if (H.pick.has(t)) H.pick.delete(t);
  else H.pick.add(t);
  renderHours();
};

$("hAdd").onclick=()=>{
  const v=$("hT").value;
  if (!v) return toast("請先選一個時間");
  H.extra.add(v);
  H.pick.add(v);
  $("hT").value="";
  renderHours();
};

/**
 * mode: set＝覆蓋成 list；add＝把 list 加進每一天；del＝從每一天移除 list
 * 只改本機暫存，按下方「儲存營業時間」才會寫進試算表。
 */
function opHours(mode,list) {
  const days=[...H.sel];
  if (!days.length) return;

  const plan=days.map(ds=>{
    const cur=daySlots(ds);
    const next=[...new Set(
      mode==="set"?list:mode==="add"?[...cur,...list]:cur.filter(x=>!list.includes(x))
    )].sort();
    return {ds,cur,next,removed:cur.filter(x=>!next.includes(x))};
  }).filter(p=>p.cur.join()!==p.next.join());

  if (!plan.length) return toast("沒有任何變動");

  // 要移除的時段如果已經有人預約，先提醒
  const hit=[];
  plan.forEach(p=>S.bookings.forEach(b=>{
    if (b["日期"]===p.ds&&p.removed.includes(b["時間"])&&["待確認","已預約"].includes(b["狀態"])) {
      hit.push(`${md(p.ds)} ${b["時間"]} ${b["姓名"]}`);
    }
  }));

  if (mode==="del"||hit.length) {
    const msg=(mode==="del"?`從 ${plan.length} 天移除 ${list.join("、")}？`:"這些時段會被移除：")
      +(hit.length?`\n\n其中這些時段已有預約（預約不會被取消）：\n${hit.join("\n")}`:"");
    if (!confirm(msg)) return;
  }

  plan.forEach(p=>{
    const s=p.next.join(",");
    dirty.set(p.ds,{date:p.ds,slots:s,note:null});
    const ex=S.hours.find(h=>h.date===p.ds);
    if (ex) ex.slots=s;
    else S.hours.push({date:p.ds,slots:s,note:""});
  });

  H.sel.clear();
  renderHours();
  updBar();
  toast(`已套用到 ${plan.length} 天，記得按下方儲存`);
}

$("hApply").onclick=()=>H.pick.size||H.sel.size===1?opHours("set",[...H.pick]):toast("請先選時段，或按「設為休息」");
$("hPlus").onclick=()=>H.pick.size?opHours("add",[...H.pick]):toast("請先選要加入的時段");
$("hMinus").onclick=()=>H.pick.size?opHours("del",[...H.pick]):toast("請先選要移除的時段");
$("hOff").onclick=()=>opHours("set",[]);

/* 服務項目 */
let SF="all";
const SK=["服務名稱","價格","課程分鐘","緩衝分鐘","狀態"];
const svcNorm=a=>JSON.stringify(a.map(s=>SK.map(k=>String(s[k]??""))));

function renderServices() {
  const h=svc.map((s,i)=>{
    if ((SF==="on"&&s["狀態"]!=="啟用")||(SF==="off"&&s["狀態"]!=="停用")) return "";

    const f=(k,l)=>`<label>${l}<input type="number" inputmode="numeric" data-i="${i}" data-k="${k}" value="${esc(s[k])}"></label>`;

    return `<div class="card">
      <input style="width:100%;font-weight:600" placeholder="服務名稱" data-i="${i}" data-k="服務名稱" value="${esc(s["服務名稱"])}">
      <div class="f3">${f("價格","價格")}${f("課程分鐘","課程分鐘")}${f("緩衝分鐘","緩衝分鐘")}</div>
      <div class="row sp">
        <select data-i="${i}" data-k="狀態">
          <option ${s["狀態"]==="啟用"?"selected":""}>啟用</option>
          <option ${s["狀態"]==="停用"?"selected":""}>停用</option>
        </select>
        <button class="b g sm d" data-del="${i}">刪除</button>
      </div>
    </div>`;
  }).join("");

  $("slist").innerHTML=h||'<p class="mute">沒有符合的服務。</p>';
}

$("slist").oninput=$("slist").onchange=e=>{
  const el=e.target.closest("[data-i]");
  if (!el) return;
  svc[+el.dataset.i][el.dataset.k]=el.value;
  updBar();
};

$("slist").onclick=e=>{
  const b=e.target.closest("button[data-del]");
  if (!b) return;

  const i=+b.dataset.del;
  if (!confirm(`確定刪除「${svc[i]["服務名稱"]||"未命名服務"}」？\n已經存在的預約紀錄不受影響。`)) return;

  svc.splice(i,1);
  renderServices();
  updBar();
};

$("sf").onclick=e=>{
  const b=e.target.closest("button[data-f]");
  if (!b) return;

  SF=b.dataset.f;
  document.querySelectorAll("#sf .pill").forEach(x=>{
    x.classList.toggle("on",x===b);
  });
  renderServices();
};

$("sAdd").onclick=()=>{
  svc.push({
    "服務名稱":"",
    "價格":"",
    "課程分鐘":"",
    "緩衝分鐘":"0",
    "狀態":"啟用"
  });

  SF="all";
  document.querySelectorAll("#sf .pill").forEach(x=>{
    x.classList.toggle("on",x.dataset.f==="all");
  });

  renderServices();
  updBar();
  window.scrollTo(0,document.body.scrollHeight);
};

/* 會員：儲值金／堂數、自己的備註、系統紀錄 */
function renderMembers() {
  const q=$("mq").value.trim().toLowerCase();
  const list=S.members.filter(m=>!q||(m["姓名"]+m["電話"]).toLowerCase().includes(q));

  $("mlist").innerHTML=list.length?list.map(m=>{
    const key=phoneKey(m["電話"]);
    const n=S.bookings.filter(b=>phoneKey(b["電話"])===key&&b["狀態"]!=="已取消").length;
    const w=num(m["儲值金餘額"]), s=num(m["剩餘堂數"]);

    return `<div class="card">
      <div class="row sp">
        <b>${esc(m["姓名"])}</b>
        <span class="mute">預約 ${n} 次</span>
      </div>
      <div class="mute" style="margin-top:5px">
        <a href="tel:${esc(fixPhone(m["電話"]))}">${esc(fixPhone(m["電話"]))}</a>
       　首次 ${esc(m["首次預約日期"])}
      </div>
      <div class="bal">
        <span class="tag">儲值金 $${w}</span>
        <span class="tag">剩餘 ${s} 堂</span>
      </div>
      <div class="row adj">
        <select data-adj-type>
          <option value="wallet">儲值金</option>
          <option value="sessions">堂數</option>
        </select>
        <input type="number" inputmode="numeric" data-adj-val placeholder="數量">
        <input class="w" data-adj-why placeholder="原因（選填）">
        <button class="b sm" data-adj="1">增加</button>
        <button class="b g sm d" data-adj="-1">扣除</button>
      </div>
      <textarea rows="2" data-r="${m._row}" placeholder="我的備註，例如偏好、提醒事項…">${esc(m["備註"])}</textarea>
      ${sysBox((m["系統備註"]||"").trim())}
    </div>`;
  }).join(""):'<p class="mute">沒有符合的會員。</p>';
}

$("mq").oninput=renderMembers;

// 自己寫的備註
$("mlist").onchange=async e=>{
  const t=e.target.closest("textarea[data-r]");
  if (!t) return;

  const m=S.members.find(x=>String(x._row)===t.dataset.r);
  const note=t.value;

  try {
    await api("saveMember",{row:m._row,name:m["姓名"],phone:m["電話"],note});
    m["備註"]=note;
    toast("備註已儲存");
  } catch(err) {
    toast(err.message);
  }
};

// 增加／扣除儲值金或堂數
$("mlist").onclick=async e=>{
  const b=e.target.closest("button[data-adj]");
  if (!b) return;

  const card=b.closest(".card");
  const m=S.members.find(x=>String(x._row)===card.querySelector("textarea[data-r]").dataset.r);
  const type=card.querySelector("[data-adj-type]").value;
  const valEl=card.querySelector("[data-adj-val]");
  const val=Number(valEl.value);
  const reason=card.querySelector("[data-adj-why]").value.trim();
  const label=type==="wallet"?"儲值金 $":"堂數 ";

  if (!(val>0)||Math.round(val)!==val) return toast("請輸入大於 0 的整數");

  const delta=val*Number(b.dataset.adj);
  if (delta<0&&!confirm(`確定從 ${m["姓名"]} 扣除 ${label}${val}？`)) return;

  b.disabled=true;
  try {
    await api("adjustMember",{row:m._row,name:m["姓名"],phone:m["電話"],type,delta,reason});
    valEl.value=""; // 清空後，自動更新才會重畫這張卡片
    await refresh();
    toast(delta>0?"已增加":"已扣除");
  } catch(err) {
    toast(err.message);
    b.disabled=false;
  }
};

/* 儲存 */
function updBar() {
  const bar=$("bar"),b=$("save");

  if (tab==="hours"&&dirty.size) {
    bar.hidden=false;
    b.textContent=`儲存營業時間（${dirty.size} 天）`;
  } else if (tab==="services"&&svcNorm(svc)!==svcNorm(S.services)) {
    bar.hidden=false;
    b.textContent="儲存服務項目";
  } else {
    bar.hidden=true;
  }
}

$("save").onclick=async()=>{
  const b=$("save");
  b.disabled=true;

  try {
    if (tab==="hours") {
      await api("saveHours",{rows:[...dirty.values()]});
      dirty.clear();
    } else {
      if (!svc.length&&!confirm("服務項目會全部清空，確定嗎？")) {
        b.disabled=false;
        return;
      }

      await api("saveServices",{
        list:svc.map(s=>Object.fromEntries(SK.map(k=>[k,s[k]])))
      });
    }

    await load();
    toast("已儲存");
  } catch(e) {
    toast(e.message);
  }

  b.disabled=false;
  updBar();
};

function applyRole() {
  const dev=S.role==="dev";
  $("rolebadge").hidden=!dev;
  $("chg").hidden=dev; // 維護帳號不能改客戶密碼
}

function renderAll() {
  applyRole();
  renderBookings();
  renderHours();
  renderServices();
  renderMembers();
  updBar();
}

/* ---------- 即時更新（不用重新登入） ---------- */

// 使用者正在輸入時，不重畫該區，避免打到一半的字被洗掉
function editingNow() {
  const a=document.activeElement;
  if (a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.closest("#p-members,#p-services")) return true;
  return [...document.querySelectorAll("#mlist [data-adj-val],#mlist [data-adj-why]")].some(i=>i.value);
}

async function doRefresh(manual) {
  if (!session||$("app").hidden) return;

  try {
    const j=await api("getAll");
    const svcDirty=svcNorm(svc)!==svcNorm(S.services); // 服務項目有沒有未儲存的修改

    S=j;

    // 營業時間尚未儲存的修改，疊回最新資料上
    dirty.forEach((v,ds)=>{
      const ex=S.hours.find(h=>h.date===ds);
      if (ex) ex.slots=v.slots;
      else S.hours.push({date:ds,slots:v.slots,note:""});
    });

    if (!svcDirty) svc=S.services.map(s=>({...s}));

    applyRole();
    renderBookings();
    renderHours();
    if (!svcDirty&&!editingNow()) renderServices();
    if (!editingNow()) renderMembers();
    updBar();

    $("stamp").textContent="更新 "+new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false});
    if (manual) toast("已更新");
  } catch(e) {
    if (manual) toast(e.message);
  }
}

// 請求排隊執行，避免定時更新和操作後更新互相覆蓋
let rq=Promise.resolve();
function refresh(manual) {
  rq=rq.then(()=>doRefresh(manual));
  return rq;
}

$("rf").onclick=()=>refresh(true);

// 每 30 秒自動更新（頁面在前景才更新）；切回頁面時立刻更新一次
setInterval(()=>{ if (!document.hidden) refresh(); },30000);
document.addEventListener("visibilitychange",()=>{ if (!document.hidden) refresh(); });
window.addEventListener("focus",()=>refresh());
</script>
